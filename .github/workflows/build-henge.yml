# Builds and tests this branch from the fork's Actions tab:
# Actions > Build Henge IPA > Run workflow > branch walriyami-fork. Combines the "mac-tests" and
# "ipa" jobs from .github/workflows/dev-build.yml so workflow_dispatch verifies the Mac tests and
# builds Henge.ipa / Henge.tipa.

name: Build Henge IPA

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mac-tests:
    name: Engine tests (Mac)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the libraries the Mac build links
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install pkg-config cmake glib libimobiledevice libtatsu libzip

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" all

      - name: Test
        run: make test

      # The tests that drive the host's GPU (Metal), which make test leaves out; run whatever make test said
      - name: GPU tests
        if: ${{ !cancelled() }}
        run: make test-gpu

  ipa:
    name: Henge.ipa
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: Henge

      - name: Restore Husk and StikJIT
        uses: actions/cache@v4
        with:
          path: |
            work/Husk/.git
            work/Husk/src/app/Frameworks
            work/Husk/build/ios-arm64
            work/StikJIT/StikJIT.xcframework
          key: ios-deps-${{ hashFiles('Henge/ci/build-ipa.sh', 'Henge/ci/build-stikjit.sh', 'Henge/ci/stikjit-high-address.patch') }}

      - name: Build Henge.ipa and Henge.tipa
        run: bash Henge/ci/build-ipa.sh work

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Henge-walriyami-${{ github.sha }}
          path: |
            ~/Desktop/Henge.ipa
            ~/Desktop/Henge.tipa
          if-no-files-found: error
          retention-days: 14
